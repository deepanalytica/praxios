name: Preview Cloudflare Pages

on:
  push:
    branches:
      - develop/value-factory-v1
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: praxios-preview
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Quality gate
        run: |
          npm run lint
          npm run typecheck
          npm run test
          npm run build

      - name: Deploy preview
        run: npx wrangler pages deploy dist --project-name=praxios-value-factory --branch=value-factory-v1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
